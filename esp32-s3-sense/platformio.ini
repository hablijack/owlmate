; ============================================================================
; Gemeinsame Basis fuer die DIAGNOSE-Envs: reiner Arduino-Modus, vorkompilierte
; Bibliotheken, Buildzeit ~1,5 s.
;
; Das echte Firmware-Env darunter laeuft dagegen als "arduino, espidf" (Arduino
; als IDF-Komponente), weil nur so esp-dl fuer die Gesichtserkennung verfuegbar
; ist. Das kostet mehrere Minuten Buildzeit - und genau deshalb erben die
; Diagnose-Envs von DIESER Sektion und nicht vom Haupt-Env.
; ============================================================================
[arduino_base]
; 2026-08-24: upgraded from espressif32@7.0.1 (Arduino core 2.0.17 / ESP-IDF
; 4.4) to the pioarduino platform (Arduino core 3.3.11 / ESP-IDF 5.5) to test
; whether the newer IDF octal-PSRAM init can bring up the XIAO's PSRAM, which
; the old IDF failed on (psram: "PSRAM ID read error: 0x00ffffff"). Revert with
; the backup in platformio.ini.bak if this breaks anything.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; Shadow board def: a copy of seeed_xiao_esp32s3 with memory_type overridden.
; The XIAO's octal PSRAM is wired for OPI, so we try "opi_qspi" (OPI PSRAM,
; QSPI flash). The stock "qio_opi" and "qio_qspi" both failed to init the part
; (psram: "PSRAM ID read error: 0x00ffffff"). Note: if the part is genuinely
; dead, NO mode will help - the firmware now guards against a null PSRAM
; framebuffer (GC9D01::drawPixel/fillScreen/flush) so it idles in ERROR
; instead of abort-looping. Overriding memory_type via board_build.* in this
; ini is ignored by the platform, so we shadow the board JSON (boards_dir).
board = seeed_xiao_esp32s3
boards_dir = boards
board_build.partitions = partitions.csv
; 2026-08-24: the pioarduino core's platform.txt hardcodes
; build.memory_type={build.boot}_qspi (i.e. QUAD psram), which clobbers our
; qio_opi and is why the new core booted as "quad_psram: PSRAM chip not
; connected". Force the octal memory type here (the builder reads
; board_build.memory_type and it wins). The core ships a prebuilt qio_opi SDK
; (framework-arduinoespressif32-libs/esp32s3/qio_opi), so this links cleanly.
board_build.memory_type = qio_opi
framework = arduino
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Silence the Arduino core's own log output. This USB CDC port carries the
    ; NDJSON protocol the RPi supervisor parses, so stray "[E][esp32-hal-i2c-ng]"
    ; lines are protocol garbage on a machine-to-machine link. They were also
    ; actively misleading: the BNO055's post-reset ID poll NACKs ~18 times at
    ; every boot (see Sensors.cpp) and a previous session read that burst as a
    ; dead I2C bus. The diagnostic envs below override build_flags and so keep
    ; full core logging -- raise it here temporarily if you need it.
    -DCORE_DEBUG_LEVEL=0
    ; 2026-08-24: face-detection temporarily DISABLED for the new-core (3.3.11)
    ; PSRAM test because the prebuilt MSRD model header
    ; (human_face_detect_msr01.hpp) is not present in the repo. The camera still
    ; initializes and allocates its framebuffers in PSRAM, so this is still a
    ; valid PSRAM test. Re-enable (set to 1) once the model header is restored.
    -DFACE_DETECTION_ENABLED=0
lib_deps =
    adafruit/Adafruit BNO055@^1.6.1
    adafruit/Adafruit GPS Library@^1.3.4
    adafruit/Adafruit PWM Servo Driver Library@^3.0.0
    bblanchon/ArduinoJson@^7.2.0

; Power-rail probe: minimal image (no PSRAM/LCD/camera/I2C) that only reads
; the 5 V input sense pin. Used to tell "3.3 V rail dragged down by a
; peripheral load" from "rail fundamentally dead". Build/flash with:
;   pio run -e powerprobe && pio run -e powerprobe -t upload
; Revert to the real firmware with:  pio run && pio run -t upload

; ============================================================================
; ECHTE FIRMWARE - Arduino als ESP-IDF-Komponente.
;
; Warum dieser Modus: die Gesichtserkennung braucht esp-dl. Das ist in den
; vorkompilierten Arduino-Bibliotheken von Core 3.x NICHT enthalten, wohl aber
; als IDF-Komponente in der Plattform. Nur der espidf-Modus kann verwaltete
; Komponenten einbinden (siehe src/idf_component.yml).
;
; Was dabei umzieht: alle board_build.*-Optionen des Arduino-Modus wirken hier
; nicht mehr, insbesondere NICHT board_build.memory_type. Das oktale PSRAM wird
; stattdessen in sdkconfig.defaults konfiguriert (CONFIG_SPIRAM_MODE_OCT), und
; dort steht auch CONFIG_FREERTOS_HZ=1000 - eine harte Anforderung des
; Arduino-Cores, ohne die der Build abbricht.
;
; Nachgewiesen auf Hardware am 2026-08-26 im Vorprojekt facelab/: PSRAM 8 MB
; sauber initialisiert, Kamera OV3660, esp-dl-Inferenz 48 ms (~21 Bilder/s).
;
; Buildzeit: kalt mehrere Minuten, inkrementell wenige Sekunden.
; ============================================================================
[env:xiao_esp32s3]
extends = arduino_base
framework = arduino, espidf
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Kernlogs aus: dieser USB-CDC-Port traegt das NDJSON-Protokoll, das der
    ; RPi parst. Diagnose-Envs unten ueberschreiben build_flags und behalten
    ; ihre Logs.
    -DCORE_DEBUG_LEVEL=0
    ; Gesichtserkennung AN - esp-dl ist in diesem Modus verfuegbar.
    -DFACE_DETECTION_ENABLED=1

[env:powerprobe]
extends = arduino_base
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFACE_DETECTION_ENABLED=0
    -DHARDWARE_CHECK=0
    -DPOWER_PROBE=1
[env:dualtest]
extends = arduino_base
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFACE_DETECTION_ENABLED=0
    -DHARDWARE_CHECK=0
    -DDUALTEST_ACTIVE
build_src_filter = +<dualtest.cpp>
; Drop the inherited lib_deps: this sketch needs only Arduino.h + SPI.h, and
; the Adafruit libs would otherwise be compiled (and fail to find SPI.h,
; since nothing in the trimmed dependency graph pulls the core's SPI library
; in for them).
; Only the core's SPI library -- the inherited Adafruit lib_deps are not
; needed here and would fail to resolve SPI.h in the trimmed graph.
lib_deps = SPI

; I2C bus diagnostic. Answers whether the sensors are on the bus at all, on
; which pins, and whether the ESP-IDF driver or the wiring is at fault -- it
; includes a bit-banged scan that bypasses the driver completely.
; Use:  pio run -e i2ctest && pio run -e i2ctest -t upload
[env:i2ctest]
extends = arduino_base
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFACE_DETECTION_ENABLED=0
    -DHARDWARE_CHECK=0
    -DI2CTEST_ACTIVE
build_src_filter = +<i2ctest.cpp>
lib_deps = Wire

; BNO055 mounting-orientation + live calibration helper. Prints the gravity
; vector in the SENSOR's own frame (to derive the axis remap) plus the four
; calibration counters (to guide the figure-8 dance). See src/imuaxis.cpp.
; Use:  pio run -e imuaxis && pio run -e imuaxis -t upload
[env:imuaxis]
extends = arduino_base
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFACE_DETECTION_ENABLED=0
    -DHARDWARE_CHECK=0
    -DIMUAXIS_ACTIVE
build_src_filter = +<imuaxis.cpp>
lib_deps =
    adafruit/Adafruit BNO055@^1.6.1

; SW-420 Vibrationssensor-Diagnose: Pull-Test (angeschlossen? aktiv getrieben?),
; analoge Spannung am Pin, danach Live-Flankenzaehler zum Antippen und
; Poti-Einstellen. Siehe src/vibtest.cpp.
; Use:  pio run -e vibtest && pio run -e vibtest -t upload
[env:vibtest]
extends = arduino_base
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFACE_DETECTION_ENABLED=0
    -DHARDWARE_CHECK=0
    -DVIBTEST_ACTIVE
build_src_filter = +<vibtest.cpp>
lib_deps =

; OV2640 Kamera-Inbetriebnahme: Treiber-Init, Sensor-ID, Bildaufnahme und
; Helligkeitsmessung (erkennt "initialisiert, liefert aber nur Schwarz").
; Ohne Gesichtserkennung - esp-dl fehlt im Arduino-Core 3.x, siehe BACKLOG.md.
; Use:  pio run -e camtest && pio run -e camtest -t upload
[env:camtest]
extends = arduino_base
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFACE_DETECTION_ENABLED=0
    -DHARDWARE_CHECK=0
    -DCAMTEST_ACTIVE
build_src_filter = +<camtest.cpp>
lib_deps =
