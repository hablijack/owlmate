; ============================================================================
; facelab - isoliertes Experiment: esp-dl v3 unter Arduino + ESP-IDF
;
; ABSICHTLICH EIN EIGENES PROJEKT, kein weiteres Env im Hauptprojekt. Grund:
; "framework = arduino, espidf" kompiliert IDF und Arduino-Core aus dem
; Quellcode und braucht eine eigene sdkconfig - und eine idf_component.yml in
; src/ wuerde von allen Envs des Hauptprojekts gesehen werden. Die sieben dort
; funktionierenden Envs (inkl. der muehsam erkaempften PSRAM-Konfiguration)
; bleiben davon unberuehrt.
;
; MEILENSTEIN 1 (dieser Stand): baut der Dual-Framework-Modus, und kommt das
; PSRAM hoch? Noch OHNE esp-dl - erst wenn das steht, ist alles Weitere
; ueberhaupt sinnvoll.
; ============================================================================
[env:facelab]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino, espidf
board_build.partitions = partitions.csv

build_flags =
    ; Serial laeuft ueber USB-Serial-JTAG (Hardware), nicht TinyUSB - wie im
    ; Hauptprojekt. USB_MODE=1 waehlt genau das aus.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
