# Satz -> Stimmung: Trainings- und Pruefsaetze fuer den Gefuehls-Klassifikator (brain/mood.py).
#
# train: woraus tools/train_mood.py lernt. test: Saetze, die das Training NIE sieht -- an ihnen
# wird gemessen, ob das Modell verallgemeinert. Neue Saetze (vor allem echte, die die Eule
# falsch eingeordnet hat) gehoeren nach train; test nur erweitern, nie daraus trainieren.
#
# Die Saetze stehen in normaler Schreibung. tools/train_mood.py uebt zusaetzlich die Form,
# in der Vosk sie liefert (klein, ohne Satzzeichen) und mit vorangestelltem Namen.
#
# Jeder Schluessel muss eine Stimmung der Firmware sein (NAMES[] in lib/Eyes/Eyes.cpp).
# Was die Stimmungen hier bedeuten -- die Reaktion der Eule auf das GESAGTE:
#   glee        Jubel: grosses Glueck, Erfolg, Gewinn, tolle Neuigkeit
#   happy       Freude: Lob, Zuneigung, Dank, etwas Nettes, gute Laune
#   sad_down    Traurigkeit: Verlust, Enttaeuschung, Pech, mieses Wetter, Einsamkeit
#   scared      Erschrecken: Schmerz, Verletzung, Unfall, Gefahr, Angst, ploetzlicher Laerm
#   surprised   Ueberraschung: etwas Unerwartetes, Verblueffung
#   awe         Staunen: etwas Schoenes, Grosses, Beeindruckendes sehen
#   angry       Wut: Aerger ueber jemanden, Ungerechtigkeit, Betrug, Beleidigung
#   annoyed     Genervt: Stoerung, Laerm, Warten, "lass das", Technik streikt
#   sleepy      Muedigkeit: muede, schlafen, gute Nacht
#   unimpressed Gleichgueltig: Langeweile, egal, nichts Besonderes
#   skeptic     Zweifel: Unglaube, Misstrauen, "das stimmt doch nicht"
#   neutral     kein Gefuehl: Frage, Feststellung, Bitte -> die Eule schaut nur zu dir
