# Robot Owl I2S sound card ALSA configuration (Orange Pi Zero 3W / A733).
#
# The MAX98357A amp (playback) and the ICS43434 mic (capture) share one I2S0
# controller, so both directions run at the card's fixed 48 kHz, 2 slots x
# 32-bit (BCLK = 64 x LRCLK). The plug plugins convert any application format
# to that; dmix (playback) and dsnoop (capture) let several apps share the one
# hardware stream in each direction.
#
# Installed to /etc/asound.conf by setup.sh. The card is named "owl" by the
# owl_i2s kernel module, so the hardware PCM is hw:owl.
#
# NOTE: if the A733 controller turns out to advance dmix/dsnoop timing
# unreliably (as it does on the Radxa A7Z), replace the dmixed/array blocks
# below with a plain `type plug` / `slave.pcm "hw:owl"` pair - that is the
# Whisplay A7Z fallback.

defaults.pcm.rate_converter "speexrate_best"

pcm.!default {
    type asym
    playback.pcm "owl.playback"
    capture.pcm "owl.capture"
}

ctl.!default {
    type hw
    card owl
}

pcm.owl {
    type asym
    playback.pcm "owl.playback"
    capture.pcm "owl.capture"
}

ctl.owl {
    type hw
    card owl
}

pcm.owl.playback {
    type plug
    slave.pcm "owl.dmixed"
}

pcm.owl.capture {
    type plug
    slave.pcm "owl.array"
}

pcm.owl.dmixed {
    type dmix
    ipc_key 777001
    slave {
        pcm "hw:owl"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}

pcm.owl.array {
    type dsnoop
    ipc_key 777002
    slave {
        pcm "hw:owl"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}
