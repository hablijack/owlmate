# Robot Owl OrangePi Brain Configuration

serial:
  port: /dev/ttyACM0
  baudrate: 115200
  timeout: 1

# NOTE: there is deliberately no `expressions:` list here any more.
#
# There used to be a 42-line name -> name mapping at this point. NOTHING read
# it: the OrangePi's expression list lives in brain/expressions.py, which is
# GENERATED from NAMES[] in esp32-s3-sense/lib/Eyes/Eyes.cpp
# (tools/gen_expressions.py). The dead block was also a third copy of that
# vocabulary and had already drifted from the firmware.
#
# The expression names that ARE configurable are the ones inside
# speech.reactions (and emotion.labels) below; the test suite validates them
# against the firmware list, because an unknown name is not rejected -- the
# firmware silently renders "neutral", so a typo looks like an eye that refuses
# to change.
#
# The ESP32 owns behavior timing (see esp32-s3-sense/include/config.h). The
# OrangePi only sends expressions as temporary overrides, and each lasts 3 s
# (EXPRESSION_OVERRIDE_MS) before the firmware's state machine takes the eyes
# back -- re-send faster than that to hold a mood.

# Autonomous sleep (Phase 4): the owl falls asleep BY ITSELF when the
# environment goes quiet, and wakes on a real interaction. There is deliberately
# NO command / spoken word that forces it to sleep.
#
#   enabled  - run the inactivity policy (disabled by default: existing
#              deployments keep the current "never auto-sleeps" behavior)
#   after_s  - how long with NO interaction trigger before the owl is put to
#              sleep. An "interaction trigger" (resets the timer) is any of:
#                * a face detected (ESP32 camera)
#                * a vibration / tap (SW420)
#                * the OrangePi hearing the user (speech) -- see speech.wake_keywords
#              Note the firmware ALREADY self-wakes the owl on a face or a
#              vibration; this policy only adds the "fall asleep on inactivity"
#              half and the "wake on speech" half (see speech.wake_keywords).
supervisor:
  auto_sleep:
    enabled: false
    after_s: 60

# Optional web UI for manually testing features (blink, expressions, head).
# It forwards the same NDJSON commands the supervisor uses and shows live
# telemetry. LAN-only by default; there is NO authentication, so do not expose
# this port beyond your local network.
web:
  enabled: false
  host: 0.0.0.0
  port: 8080

# Status display: a tiny 0.91" 128x32 SSD1306 OLED on one of the OrangePi's own
# I2C buses (NOT the XIAO's bus). It shows the owl's current mode (IDLE,
# DETECTING, INTERACTING, STARTING, NO LINK, ...) and a small line with the
# firmware loop rate and whether a face is seen. Dims while the owl sleeps and
# says BRAIN OFF when the brain stops. No extra Python package needed; the
# service user must be in the 'i2c' group (setup.sh / the service file do that).
#
#   enabled     - drive the panel (disabled by default like every feature block)
#   i2c_bus     - Linux bus number, i.e. /dev/i2c-<n>. `sudo i2cdetect -l` lists
#                 them; the panel normally answers at 0x3C (or 0x3D) on the bus
#                 whose header pins it is wired to. NOTE: the "SUNXI HDMI"
#                 adapter (i2c-20 here) is the HDMI DDC channel; a device that
#                 only shows up there (0x30) is the monitor link, not the OLED.
#   address     - I2C address, 0x3C by default (PyYAML reads 0x3C as 60)
#   portrait    - panel mounted with its long side vertical: upright letters, one
#                 under the other from top to bottom (the owl's backpack)
#   rotate      - true if the picture is upside down / mirrored for your mounting
#   interval_s  - how often to check for a changed picture
#   retry_s     - how long to wait before reopening after the panel disappeared
#   dim_when_sleeping - turn the panel to minimum contrast while the owl sleeps
display:
  enabled: false
  i2c_bus: 2        # TWI2 (PE2 SDA / PE1 SCL) via /boot/overlay-user/owl-i2c2.dtbo, see specs/012
  address: 0x3C
  portrait: false
  rotate: false
  interval_s: 0.5
  retry_s: 30
  dim_when_sleeping: true

# Navigation ("guide me home"): the owl becomes a compass that points at a
# named destination. You teach it places (name + lat/lon) in the web UI's
# "Places" card, then say "Bring mich nach <name>" (or press Start in the web
# UI) and its head continuously turns to point at the destination.
# pattern: see specs/013-navigation.spec.
#
#   enabled          - run the navigation controller (disabled by default so
#                      existing deployments are unaffected)
#   locations_file   - where named places are persisted; "" = default
#                      (~/.config/robot-owl/locations.json)
#   head_min/max     - the head servo's range; the aim is clamped to this so a
#                      destination behind the owl pins the head to its limit
#   refresh_min_s    - min seconds between head-angle updates sent to the ESP32
#   arrive_m         - "you've arrived" distance from the destination
#   timeout_s        - stop navigating if no telemetry for this long (a dropped
#                      link must not leave the head stuck pointing)
#   aim_sign         - +1 or -1. The ONE thing to confirm on hardware: if the
#                      head points the WRONG way, flip this (see plan §10/#1).
#   sound_start/stop - sounds cued on entering / leaving navigation
navigation:
  enabled: false
  locations_file: ""
  head_min: -45
  head_max: 45
  refresh_min_s: 0.5
  arrive_m: 15.0
  timeout_s: 120
  aim_sign: 1
  sound_start: detecting
  sound_stop: waking

# Audio via MAX98357A I2S amp on the OrangePi (see WIRING.md). The OrangePi
# generates short sound effects in-process and plays them over I2S. If the amp
# is not wired / I2S not enabled, the brain still runs and just logs that audio
# is unavailable.
#
#   device - the ALSA card the amp + mic share (from `aplay -l` / `arecord -l`);
#            "" = default. On the OrangePi this is the owl_i2s kernel module's
#            card (the one that drives the MAX98357A amp on I2S0 and also
#            captures the ICS43434 mic on the same card).
#   volume - 0.0 - 1.0 master gain applied to generated samples.
#
# The amp and the mic share ONE I2S card (I2S0 on PB4-PB8), fixed at 48 kHz by
# the owl_i2s kernel module. On the installed vendor kernel, stopping playback
# can silence ongoing capture. keep_playback_clock holds silent TX open as a
# workaround (SPEC-015); it is opt-in and consumes resources while brain runs.
# It requires a shared dmix output PCM, not an exclusive hw: device.
audio:
  enabled: true
  device: ""          # e.g. "owl_playback" (leave "" for the default card)
  keep_playback_clock: false  # A733 workaround: silent shared TX for reliable mic
  feedback_tail_s: 0.6  # suppress mic blocks during real playback + this reverb tail
  volume: 0.8        # 0.0 - 1.0 master gain applied to generated samples

# Mute switch: a slide switch from header pin 13 (PB1) to GND. In the mute
# position the owl plays no sound at all (the amp card has no volume control, so
# the brain simply starts no player). Read by the brain (brain/mute_switch.py).
# The pin uses the A733's internal pull-up; nothing else needs wiring.
#
#   chip       - gpiochip LABEL ("2000000.pinctrl" = the main pin controller) or a
#                /dev/gpiochipN path. Prefer the label: gpiochip1 has the WLAN pins
#                at the same offsets.
#   line       - port name (PB1) or raw line offset (33)
#   muted_when - "closed" (switch connects the pin to GND = mute) or "open".
#                The owl is wired so that OPEN = mute (owner's choice, 2026-11-04).
#   poll_s     - how often the position is read; a change needs two equal reads
#
# Bench check: sudo .venv/bin/python -m brain.gpio PB0 PB1  (1 = contact closed)
mute_switch:
  enabled: false
  chip: 2000000.pinctrl
  line: PB1
  muted_when: open
  poll_s: 0.2

# Power button: a push button from header pin 11 (PB0) to GND shuts the Orange Pi
# down cleanly (wait for the green LED to go out, then switch the power bank
# off). NOT run by the brain: deploy/robot-owl-power.service runs
# brain/power_button.py as root, so it still works when the brain has crashed.
#
#   hold_s  - how long the button must be held (a bump must not switch the owl off)
#   command - what is run; the button only arms after it was seen released once,
#             so a stuck button cannot shut the owl down on every boot
power_button:
  enabled: false
  chip: 2000000.pinctrl
  line: PB0
  hold_s: 2.0
  poll_s: 0.05
  command: ["shutdown", "-h", "now"]

# Fallback hotspot: when no known WLAN is reachable (at home: "Olymp"), the Orange Pi
# opens its own access point so a phone can still open the control page at
# http://<address>:8080 (web.enabled must be true). Runs as its own root service
# (deploy/robot-owl-hotspot.service, brain/hotspot.py), like the power button.
# The AP lives on a second, virtual interface (ap_interface); wlan0 is never touched, so
# the Orange Pi keeps looking for the known WLAN and rejoins it on its own.
#
#   passphrase_file - WPA2 passphrase, root-only (0600), 8..63 characters. Deliberately NOT
#                     in this file, which is public. No valid passphrase = no hotspot: the
#                     control page has no login, an open AP would hand the owl to anyone.
#   wait_s          - how long wlan0 may be without a link (association + IPv4) before the
#                     AP opens. It closes again once wlan0 is back AND no phone is on it.
#   channel         - only used while wlan0 is not associated; otherwise the AP must share
#                     the client's channel (one radio).
hotspot:
  enabled: false
  interface: wlan0
  ap_interface: uap0
  ssid: Hubert
  passphrase_file: /etc/robot-owl/hotspot.psk
  address: 10.42.0.1
  dhcp_first: 10.42.0.10
  dhcp_last: 10.42.0.50
  channel: 6
  country: DE
  wait_s: 90
  poll_s: 5

# Speech recognition: the owl hears the user and reacts with one of its moods (eyes, body,
# sound) or a navigation command. ASR runs on the OrangePi (the ICS43434 I2S mic), so the
# ESP32 firmware is unchanged. Disabled by default: flip 'enabled: true' once the mic and
# the models (setup.sh) are in place. Why each choice: specs/014-speech.spec.
#
#   engine        - "vosk" (streaming: answers ~0.2 s after you stop; as accurate as whisper
#                   small on the owner's recordings at ~12 % of one core) or "whisper"
#                   (whisper.cpp; small needs 3-5 s per sentence on the Zero 3W)
#   vosk_model    - LOCAL directory of the Vosk model (vosk-model-small-de-0.15, setup.sh)
#   mic_device    - ALSA capture device (from `arecord -l`); "" = default
#   --- the following only matter for engine: whisper (energy VAD + whisper.cpp) ---
#   model         - LOCAL path to a whisper.cpp model file (.bin or .gguf),
#                   e.g. models/whisper/ggml-small.bin. setup.sh downloads it;
#                   the OrangePi runs offline, so this is a path, not a hub name.
#   window_s      - length of the audio clip transcribed when the gate opens
#   chunk_s       - VAD window: how much audio accumulates before an energy check
#   sample_rate   - the ASR/VAD rate (whisper.cpp expects 16 kHz)
#   capture_rate  - the I2S card's native rate (fixed at 48 kHz by owl_i2s);
#                   the worker resamples capture_rate -> sample_rate before the VAD
#   capture_channels - the card is stereo (mic on one slot, amp on the other);
#                      capture the whole card and pick the mic in the worker
#   mic_channel   - which stereo slot the ICS43434 is on (0 = left)
#   capture_dtype - PortAudio format the card delivers; float32 is requested by
#                   default (ALSA's plug layer converts the card's native int)
#   vad_threshold - per-chunk RMS energy gate; a chunk below this is silence
#   min_utterance_s - voiced audio shorter than this is never sent to whisper (music and
#                     room noise give 0.3-0.6 s blips at speech level; sentences are >= 0.9 s)
#   threads       - whisper.cpp CPU threads (the Zero 3W has 8 cores)
#   normalize_peak - scale each utterance so its peak is this value (0.7) before whisper; the mic
#                   is very quiet and tiny hallucinates on quiet input. 0 = off
#   dump_dir      - debug: save every utterance sent to whisper as a WAV here ("" = off)
#   audio_ctx     - shorten whisper's fixed 30 s window; 192 (~3.8 s) is ample for our clips and
#                   made a 2.5 s clip 5x faster on the Zero 3W. 0 = whisper's default (slow)
#   energy_floor_ms - sustained silence (this long) closes the gate / discards
#                     a half-built utterance
#   cooldown_s  - min seconds between two reactions (the spec's COOLDOWN_TIME)
#   require_face - only react while a face is in frame (prevents reacting to TV)
#   clusters    - keyword lists (German) mapped to reaction clusters (used only while mood is off)
#   reactions   - cluster -> {expression override, sound played on the amp, gesture}.
#                 gesture is a body move played by the firmware: happy, negative,
#                 curious or startle (ears, wings, head; ignored while asleep)
#   name_alone_aliases - what the recogniser makes of the name said ALONE (no sentence around
#                   it): Vosk heard "Hubert" as "robert"/"rupert". Counted only when the whole
#                   utterance is that one word, so "Robert hat angerufen" stays unaddressed.
#   name_keywords - the owl's name as the recogniser may spell it ("hubert"; a word counts when it is >=
#                   name_threshold similar). With a name the owl reacts ONLY to speech addressed to it
#                   ("Hubert, das ist toll") and then keeps listening for name_window_s without the
#                   name; the name alone makes it answer "hello" and open that window. The name also
#                   wakes a sleeping owl. [] = off (every utterance counts). Set require_face: false
#                   with it: on a shoulder the owl never sees a face.
#   wake_keywords - Phase 4: while the owl is ASLEEP it ignores ordinary speech
#                   (so it isn't startled by the TV). Only a clearly ADDRESSED
#                   word/phrase here wakes it (the OrangePi sends the existing
#                   "wake" command, then runs the normal reaction). Keep this
#                   short and unambiguous: the owl's name and an explicit "wake"
#                   phrase. Empty list = speech never wakes it (only
#                   face/vibration do, which the firmware already handles on its own).
speech:
  enabled: false
  engine: vosk
  vosk_model: ""       # e.g. models/vosk/vosk-model-small-de-0.15 (setup.sh downloads it)
  language: de
  model: ""            # e.g. models/whisper/ggml-small.bin (setup.sh downloads it)
  mic_device: ""
  window_s: 2.5
  chunk_s: 0.3
  sample_rate: 16000
  capture_rate: 48000
  capture_channels: 2
  mic_channel: 0
  capture_dtype: float32
  vad_threshold: 0.02
  min_utterance_s: 0.8
  threads: 4
  audio_ctx: 192
  normalize_peak: 0.7
  energy_floor_ms: 700
  # Quiet audio kept around the voiced chunks (pre-roll + gaps + tail), so soft word onsets/endings
  # reach whisper instead of being cut out. 0 = voiced chunks only (old behaviour).
  context_ms: 300
  cooldown_s: 3.0
  require_face: false
  name_keywords: ["hubert"]
  name_alone_aliases: ["robert", "rupert"]
  name_window_s: 10
  name_threshold: 0.75
  wake_keywords: ["eule", "wacht auf"]
  # Navigation: phrases that START guiding toward a place. The words AFTER the
  # trigger are treated as the place name and matched (fuzzy) against the saved
  # locations, e.g. "bring mich nach hotel" -> name "hotel". In feed() these
  # triggers are checked BEFORE the emotion layer and the keyword clusters, so a
  # nav sentence is not stolen by a single question word ("wie komm ich zu ...").
  # See specs/013-navigation.spec ("four ways out", and the nav-specific stop word).
  nav_triggers: ["bring mich nach", "bringe mich nach", "zeig mir den weg nach",
                 "wie komme ich nach", "wie komme ich zum", "wie komme ich zu"]
  # Phrases that STOP navigation (see plan §13). Kept specific to navigation so
  # an ordinary "nein" (the negative cluster) doesn't cancel a route.
  nav_stop_keywords: ["stopp die navigation", "stopp navigieren", "lass die
                      navigation", "reicht", "danke"]
  clusters:
    happy:    ["fein", "brav", "toll", "super", "gute eule", "gute eure", "gute eume", "gute eile",
              "mag dich", "schön"]
    negative: ["nein", "lass das", "lasst das", "aufhören", "böse", "ach", "huch"]
    question: ["wer", "wie", "was", "warum"]
  reactions:
    # The gesture goes out AFTER the expression and brings its own eyes (firmware: happy -> glee,
    # negative -> annoyed, curious -> skeptic), so `expression` only shows where the firmware
    # ignores the gesture (asleep, locked image).
    happy:    { expression: happy,     sound: happy, gesture: happy }
    negative: { expression: sad_down,  sound: sad,   gesture: negative, own_eyes: true }
    question: { expression: surprised, sound: info,  gesture: curious }

# Mood from what is said (brain/mood.py): a small BERT, fine-tuned on our own moods, maps
# "Heute ist wirklich ein Sauwetter" -> sad_down, "Ich habe im Lotto gewonnen" -> glee.
# It replaces the keyword clusters above while it is on (they stay the fallback when off).
# Trained on a dev machine by tools/train_mood.py from assets/mood/sentences.yaml -- add
# sentences there, retrain, copy the output folder to model_dir. ~10 ms per sentence.
#
#   model_dir      - LOCAL folder with model.onnx, tokenizer.json, labels.json
#   min_confidence - below this the owl does not commit to a mood, it only looks at you
#                    (a wrong feeling is worse than none)
mood:
  enabled: false
  model_dir: ""        # e.g. models/mood
  min_confidence: 0.5
